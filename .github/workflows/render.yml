name: Render Kindle dashboard

# Timing comes from the Cloudflare Worker in trigger/ (05:50-20:50 London
# time, twice an hour), which calls workflow_dispatch. GitHub's own schedule
# trigger was dropped: it skipped runs for hours on this repo, and scheduled
# workflows get paused after 60 days without commits.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      HAS_MENU_KEY: ${{ secrets.MENU_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # School lunch menu from the private Fire dashboard repo, read with a
      # read-only deploy key. Skipped (no lunch shown) if the key isn't set
      # or the checkout fails.
      - name: Get school lunch menu
        if: env.HAS_MENU_KEY == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: nottsaifuture/fire-home-dashboard
          ssh-key: ${{ secrets.MENU_DEPLOY_KEY }}
          path: fire-menu
          sparse-checkout: dist/menus.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: renderer/requirements.txt

      # Noto Sans HK from Google's Noto project on GitHub, kept in the Actions
      # cache. (apt's Ubuntu mirrors were unreachable from the runner for
      # hours, so the font no longer comes from apt.)
      - name: Restore Chinese font
        id: font-cache
        uses: actions/cache@v4
        with:
          path: fonts
          key: noto-sans-hk-v1

      - name: Download Chinese font
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          for weight in Regular Bold; do
            curl -fsSL --retry 5 --retry-all-errors -o "fonts/NotoSansHK-$weight.otf" \
              "https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/HK/NotoSansHK-$weight.otf"
          done

      - run: pip install -r renderer/requirements.txt

      - name: Render image
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
          DASH_SECRET: ${{ secrets.DASH_SECRET }}
          MENUS_JSON: fire-menu/dist/menus.json
          BIN_CALENDAR_ID: ${{ secrets.BIN_CALENDAR_ID }}
        run: |
          if [ -z "$DASH_SECRET" ]; then
            echo "Add a DASH_SECRET repository secret first (see README)." >&2
            exit 1
          fi
          mkdir -p site
          python renderer/render.py --out "site/$DASH_SECRET.png"
          # Kindle settings, fetched by the Kindle next to the image.
          cp kindle/remote.txt "site/$DASH_SECRET.txt"
          # Nothing else is published, so the image can only be found by
          # someone who already knows its secret file name.
          echo '<!doctype html><title>Kindle</title>' > site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
